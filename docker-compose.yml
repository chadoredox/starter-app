# Étape 3 — Environnement blue/green avec docker-compose :
# - nginx en frontal (toujours démarré), génére sa config depuis un template
#   en fonction de ACTIVE_COLOR (défaut: blue)
# - redis partagé (toujours démarré)
# - app-blue et app-green démarrés ensemble, chacun avec sa couleur en env
# - la bascule se fait en changeant ACTIVE_COLOR et en rechargant nginx
#   (nginx -s reload) sans redémarrer les conteneurs

services:
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    environment:
      - ACTIVE_COLOR=${ACTIVE_COLOR:-blue}
    volumes:
      - ./deploy/nginx.conf.template:/etc/nginx/nginx.conf.template:ro
      - ./deploy/nginx-entrypoint.sh:/entrypoint.sh:ro
    command: ["/entrypoint.sh"]
    networks:
      - app-net
    depends_on:
      - app-blue
      - app-green

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  app-blue:
    build: .
    environment:
      - COLOR=blue
      - REDIS_HOST=redis
    networks:
      - app-net
    depends_on:
      redis:
        condition: service_healthy

  app-green:
    build: .
    environment:
      - COLOR=green
      - REDIS_HOST=redis
    networks:
      - app-net
    depends_on:
      redis:
        condition: service_healthy

networks:
  app-net:

volumes:
  redis-data:
