# Étape 6 — Healthcheck & dépendances conditionnées :
# depends_on seul ne garantit que l'ordre de démarrage, pas que redis
# soit réellement prêt. Chaque service déclare un healthcheck, et web
# ne démarre que lorsque redis est passé à l'état healthy.

services:
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      # Le service voisin, désigné par son nom sur le réseau dédié —
      # ni localhost, ni adresse IP fixe
      REDIS_HOST: redis
    networks:
      - app-net
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    # AOF activé : chaque incrément est journalisé, le compteur survit
    # même à un redémarrage brutal du conteneur redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks:
      - app-net
    # redis-cli est fourni par l'image officielle redis : vérification
    # simple, sans dépendance externe
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  app-net:

volumes:
  redis-data:
