# Étape 3-5 — Stack observabilité :
# - nginx en frontal (blue/green), génére sa config depuis un template
# - redis partagé
# - app-blue et app-green côte à côte, couleur via ACTIVE_COLOR
# - prometheus scrape l'app sur /metrics, charge les règles d'alerte
# - grafana avec datasource Prometheus provisionnée + dashboard provisionné

services:
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    environment:
      - ACTIVE_COLOR=${ACTIVE_COLOR:-blue}
    volumes:
      - ./deploy/nginx.conf.template:/etc/nginx/nginx.conf.template:ro
      - ./deploy/nginx-entrypoint.sh:/entrypoint.sh:ro
    command: ["/entrypoint.sh"]
    networks:
      - app-net
    depends_on:
      - app-blue
      - app-green

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  app-blue:
    build: .
    image: ghcr.io/chadoredox/starter-app:blue
    environment:
      - COLOR=blue
      - ACTIVE_COLOR=${ACTIVE_COLOR:-blue}
      - REDIS_HOST=redis
    networks:
      - app-net
    depends_on:
      redis:
        condition: service_healthy

  app-green:
    build: .
    image: ghcr.io/chadoredox/starter-app:green
    environment:
      - COLOR=green
      - ACTIVE_COLOR=${ACTIVE_COLOR:-blue}
      - REDIS_HOST=redis
    networks:
      - app-net
    depends_on:
      redis:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    networks:
      - app-net
    depends_on:
      - app-blue
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD:-admin}
    volumes:
      - ./deploy/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./deploy/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    networks:
      - app-net
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  app-net:

volumes:
  redis-data:
